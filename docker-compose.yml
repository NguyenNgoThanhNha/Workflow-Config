# Chạy toàn bộ: docker compose up --build   →  Web http://localhost:8081 · API http://localhost:8080/swagger
# Biến bí mật đọc từ file .env cạnh file này (xem .env.example); giá trị mặc định chỉ dùng để chạy thử.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-Workflow@12345}"
    ports: ["14331:1433"]
    volumes: [sqldata:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=db,1433;Database=WorkflowConfigDb;User Id=sa;Password=${SA_PASSWORD:-Workflow@12345};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY:-compose-demo-secret-key-change-me-0123456789}"
      Database__MigrateOnStartup: "true"
      Database__SeedDemoData: "${SEED_DEMO_DATA:-true}"
      Seed__AdminEmail: "${ADMIN_EMAIL:-admin@local.dev}"
      Seed__AdminPassword: "${ADMIN_PASSWORD:-Admin@123}"
      App__FrontendBaseUrl: "http://localhost:8081"
      Cors__Origins__0: "http://localhost:8081"
      FileStorage__RootPath: "/app/App_Data/uploads"
    ports: ["8080:8080"]
    volumes: [uploads:/app/App_Data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build: ./frontend
    depends_on:
      api: { condition: service_healthy }
    ports: ["8081:80"]

volumes:
  sqldata:
  uploads:
